# Portão local de qualidade. Instale uma vez por clone:
#   pip install pre-commit
#   pre-commit install --install-hooks     # instala pre-commit + commit-msg (default_install_hook_types)
#
# Rodar manualmente em tudo:  pre-commit run --all-files
# O CI roda os mesmos hooks (job `pre-commit`), então o que passa aqui passa lá.

default_install_hook_types: [pre-commit, commit-msg]
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  # Lint + formato (mesma ferramenta e config do pyproject.toml / CI).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Detecção de segredos (mesmo scanner do job `security` do CI).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Padrão de mensagem de commit (Conventional Commits, conjunto do AGENTS.md).
  - repo: local
    hooks:
      - id: conventional-commit
        name: conventional commit message
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
