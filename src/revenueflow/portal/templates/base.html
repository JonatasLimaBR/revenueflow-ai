<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RevenueFlow Portal{% block title %}{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --accent: #2563eb; --bg: #0b1220; --fg: #e5e7eb; --card: #111827; --border: #1f2937; --muted: #9ca3af; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: 1.5rem; padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); }
  header a { color: var(--fg); text-decoration: none; opacity: 0.8; }
  header a:hover { opacity: 1; }
  header .brand { font-weight: 700; margin-right: 1rem; }
  main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .kpi .value { font-size: 1.6rem; font-weight: 700; }
  .kpi .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
  form.inline { display: inline; }
  button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--fg); }
  .empty { color: var(--muted); padding: 2rem 0; text-align: center; }
  .pill { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; background: var(--border); }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if session %}
<header>
  <span class="brand">RevenueFlow</span>
  <a href="/portal/">Home</a>
  <a href="/portal/conversations">Conversas</a>
  <a href="/portal/transactions">Transações</a>
  <a href="/portal/customers">Clientes</a>
  <a href="/portal/funnel">Funil</a>
  <a href="/portal/approvals">Aprovações</a>
  <a href="/portal/handoffs">Handoffs</a>
  <a href="/portal/live">Agentes ao vivo</a>
  <span style="margin-left: auto; color: var(--muted); font-size: 0.85rem;">{{ session.email }}</span>
  <form class="inline" method="post" action="/portal/logout"><button class="secondary" type="submit">Sair</button></form>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
{% block autorefresh %}{% endblock %}
</body>
</html>
