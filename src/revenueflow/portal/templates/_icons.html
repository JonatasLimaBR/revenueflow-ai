{# Inline stroke-icon set (Lucide-style, hand-authored — no external icon font/CDN).
   Every macro takes `size` (px) and `cls` (extra CSS class) and renders a
   self-contained <svg>, stroke=currentColor so it inherits the caller's
   text color (nav link, KPI badge, agent-graph node, …). #}

{% macro status_class(value) -%}
{%- set v = (value or "")|upper -%}
{%- if v in ["WON", "PAID", "APPROVED", "RESOLVED", "COMPLETED", "DELIVERED", "SUCCESS"] -%}good
{%- elif v in ["LOST", "REJECTED", "FAILED", "EXPIRED", "CANCELLED", "DENIED"] -%}bad
{%- elif v in ["PENDING", "OPEN", "SENT", "NEW", "QUALIFYING", "QUALIFIED", "PROPOSAL", "AWAITING", "AWAIT_APPROVAL"] -%}warn
{%- else -%}
{%- endif -%}
{%- endmacro %}

{% macro home(size=18, cls="") %}
<svg class="icon {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-5h4v5"/></svg>
{% endmacro %}
