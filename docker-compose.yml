services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: revenueflow
      POSTGRES_PASSWORD: revenueflow
      POSTGRES_DB: revenueflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  pubsub-emulator:
    image: google/cloud-sdk:emulators
    command: >
      gcloud beta emulators pubsub start
      --host-port=0.0.0.0:8681
      --project=revenueflow-local
    ports:
      - "8681:8681"

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfusedata:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      - langfuse-db
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-not-a-secret
      SALT: local-dev-not-a-secret
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_started
      langfuse:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://revenueflow:revenueflow@postgres:5432/revenueflow
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8681
      PUBSUB_PROJECT_ID: revenueflow-local
      TRACER_SINK: langfuse
      LANGFUSE_HOST: http://langfuse:3000
      CHANNEL_OUTBOUND: fake
      LLM_STUB: "1"
    command: >
      sh -c "python scripts/migrate.py && python scripts/seed.py &&
      uvicorn revenueflow.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
  langfusedata:
