name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
      - "site/**"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
      - "site/**"
      # The deploy job builds and pushes the image, so image inputs must redeploy.
      - "Dockerfile"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  WORKDIR: infra/terraform

jobs:
  plan:
    # Skipped until the bootstrap outputs are set as repo Variables (ADR-048).
    if: github.event_name == 'pull_request' && vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: fmt (informational)
        continue-on-error: true
        run: terraform fmt -check -recursive

      - name: init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=prod"

      - name: validate
        working-directory: ${{ env.WORKDIR }}
        run: terraform validate -no-color

      - name: plan
        id: plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform plan -no-color -input=false -lock=false \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "region=${{ vars.GCP_REGION }}" \
            -var "image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/revenueflow/api:${{ github.sha }}" \
            -var "alert_email=${{ vars.ALERT_EMAIL }}" \
            -var 'dashboard_viewer_emails=${{ vars.DASHBOARD_VIEWER_EMAILS || '[]' }}' \
            | tee plan.txt

      - name: comment plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('${{ env.WORKDIR }}/plan.txt', 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n... (truncated)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '```\n' + body + '\n```',
            });

  deploy:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/revenueflow/api:${{ github.sha }}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=prod"

      - name: apply
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform apply -auto-approve -input=false \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "region=${{ vars.GCP_REGION }}" \
            -var "image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/revenueflow/api:${{ github.sha }}" \
            -var "alert_email=${{ vars.ALERT_EMAIL }}" \
            -var 'dashboard_viewer_emails=${{ vars.DASHBOARD_VIEWER_EMAILS || '[]' }}'

      - name: publish landing page
        working-directory: ${{ env.WORKDIR }}
        run: |
          bucket=$(terraform output -raw landing_page_bucket)
          url_map=$(terraform output -raw landing_page_url_map)
          gsutil -m rsync -r -d "${{ github.workspace }}/site" "gs://${bucket}"
          gcloud compute url-maps invalidate-cdn-cache "$url_map" --path "/*" --async
