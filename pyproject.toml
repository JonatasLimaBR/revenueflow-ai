[project]
name = "revenueflow-ai"
version = "0.1.0"
requires-python = ">=3.12"
description = "Autonomous WhatsApp Sales Platform"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
