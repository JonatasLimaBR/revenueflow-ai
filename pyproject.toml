[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenueflow-ai"
version = "0.1.0"
requires-python = ">=3.12"
description = "Autonomous WhatsApp Sales Platform"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.28",
    "langgraph-checkpoint-postgres>=2.0.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2.1",
]
events = [
    "google-cloud-pubsub>=2.21",
]
llm = [
    "google-genai>=0.8",
]
observability = [
    "langfuse>=2.50",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-gcp-trace>=1.7",
]
analytics = [
    "google-cloud-bigquery>=3.25",
]
# >=1.9 for FastMCP.streamable_http_app() (ADR-067, the public read-only HTTP
# server); the personal stdio server (ADR-064) only needed the base package.
# <2 pinned deliberately: mcp 2.x renamed FastMCP -> MCPServer and changed the
# API (found live in production, ADR-070) — this code targets the v1 FastMCP
# surface; migrating to 2.x's MCPServer is a follow-up, not this fix.
mcp = [
    "mcp>=1.9,<2",
]
# Operational portal (ADR-073): Google Sign-In verification (client-side
# token, no client secret). jinja2/python-multipart are base dependencies
# (see above) — unlike google-auth, both are needed just to import
# portal/views.py (Jinja2Templates + Form(...) routes), so gating them behind
# this extra would make the whole package unimportable in CI's base `tests`
# job (installs only `.[dev,llm]`, never `portal`).
portal = [
    "google-auth>=2.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["langfuse", "langfuse.*", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud.*", "google.cloud.pubsub_v1", "google.pubsub_v1.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google", "google.genai", "google.genai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*", "langchain_core", "langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud.bigquery", "google.cloud.bigquery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.auth", "google.auth.*", "google.oauth2", "google.oauth2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ``mcp.tool()`` resolves to ``Any`` (the package has no stubs available in CI,
# see the override above) — strict mode's disallow_untyped_decorators would
# otherwise flag every ``@mcp.tool()``-decorated function in this thin wiring
# module.
module = ["revenueflow.mcp.server"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# ``google.oauth2.id_token.verify_oauth2_token`` is untyped upstream (no stubs
# in CI, see the google.oauth2 override above) — a local env with the optional
# ``portal`` extra installed sees real (untyped) signatures and flags the call,
# while CI (extra not installed) sees ``Any`` and flags nothing; a per-call
# ``type: ignore`` is therefore inconsistent between the two. Disabling
# disallow_untyped_calls for just this module covers both environments.
module = ["revenueflow.portal.auth"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["live: real Vertex AI call; needs RUN_LIVE_EVAL=1 and ADC"]
